# Sunways Modbus RTU / RS485-USB: read-only sensor example.
# Based on the user's existing configuration; original attribution retained below.
# Replace the USB port placeholder before use.
# modified by Jan Jirousek/25.01.2024
#   sunways
modbus:  
  - name: sunways 
    # type: tcp
    # port: 502
    type: serial
    baudrate: 9600
    bytesize: 8
    method: rtu
    parity: N
    port: /dev/serial/by-id/usb-YOUR_RS485_ADAPTER-if00-port0
    stopbits: 1
    sensors:
      - name: Sunways Inverter SN
        unique_id: sunways_inverter_sn
        slave: 247
        address: 10000
        input_type: input
        data_type: string
        count: 10
        scan_interval: 86400
      - name: Sunways Firmware Version2
        unique_id: sunways_firmware_version2
        slave: 247
        address: 10013
        input_type: holding
        count: 2
        data_type: custom
        structure: ">BBBB"
        scan_interval: 60
      - name: Sunways Inverter Running Status #0:wait, wait for on-grid 1:check, self-check 2:On Grid 3:fault 4:flash, firmware update 5.Off Grid
        unique_id: sunways_inverter_running_status
        slave: 247
        address: 10105
        input_type: holding
        data_type: int16
        scan_interval: 10
      - name: Sunways Phase A Power on Meter
        unique_id: sunways_phase_a_power_on_meter
        slave: 247
        address: 10994
        input_type: holding
        state_class: measurement
        unit_of_measurement: kW
        device_class: power
        scale: 0.001
        precision: 3
        data_type: int32
        scan_interval: 10
      - name: Sunways Phase B Power on Meter
        unique_id: sunways_phase_b_power_on_meter
        slave: 247
        address: 10996
        input_type: holding
        state_class: measurement
        unit_of_measurement: kW
        device_class: power
        scale: 0.001
        precision: 3
        data_type: int32
        scan_interval: 10
      - name: Sunways Phase C Power on Meter
        unique_id: sunways_phase_c_power_on_meter
        slave: 247
        address: 10998
        input_type: holding
        state_class: measurement
        unit_of_measurement: kW
        device_class: power
        scale: 0.001
        precision: 3
        data_type: int32
        scan_interval: 10
      - name: Sunways Total Power on Meter        #Grid power
        unique_id: sunways_total_power_on_meter
        slave: 247
        address: 11000
        input_type: holding
        state_class: measurement
        unit_of_measurement: kW
        device_class: power
        scale: 0.001
        precision: 3
        data_type: int32
        scan_interval: 10
      - name: Sunways Grid Injection Energy on that day   #export/day
        unique_id: sunways_grid_injection_energy_on_that_day
        slave: 247
        address: 41000
        scale: 0.1
        precision: 2
        input_type: holding
        unit_of_measurement: kWh
